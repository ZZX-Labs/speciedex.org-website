name: Validate Speciedex repairs
on:
  push:
    paths:
      - 'static/tools/**'
      - 'static/js/**'
      - '_partials/terminal.html'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        run: python -m pip install pytest
      - name: Check Python and JavaScript sources
        run: |
          python -m compileall -q static/tools
          find static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test every provider contract and recovery regression
        env:
          PYTHONPATH: static/tools
        run: |
          python static/tools/provider-conformance.py --write-report static/data/provider-conformance.json
          python -m pytest -q static/tools/tests
          python static/tools/speciedex-selftest.py --json
