name: cmatrix recording

run-name: >-
  cmatrix recording ·
  ${{ github.event_name }} ·
  ${{ github.ref_name }} ·
  ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      cmatrix_ref:
        description: Upstream cmatrix branch, tag, or commit
        required: false
        default: master
        type: string
      recording_seconds:
        description: Number of seconds to record from upstream cmatrix
        required: false
        default: "12"
        type: string

  push:
    branches:
      - main
    paths:
      - "static/tools/cmatrix-server/**"
      - "static/js/terminal/cmatrix.js"
      - "static/js/terminal/visualization/terminal-cmatrix.js"
      - ".github/workflows/cmatrix-server.yml"

  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: write

concurrency:
  group: cmatrix-recording-${{ github.ref }}
  cancel-in-progress: true

env:
  CMATRIX_REPOSITORY: https://github.com/abishekvashok/cmatrix.git
  CMATRIX_SOURCE_DIR: ${{ github.workspace }}/.upstream/cmatrix
  CMATRIX_INSTALL_DIR: ${{ github.workspace }}/.runtime/cmatrix
  CMATRIX_RECORDING_DIR: ${{ github.workspace }}/static/data/cmatrix
  CMATRIX_RECORDING_FILE: ${{ github.workspace }}/static/data/cmatrix/cmatrix-recording.json

jobs:
  build-record-publish:
    name: Build upstream cmatrix and publish browser recording
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Speciedex
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.cmatrix_ref }}
          REQUESTED_SECONDS: ${{ inputs.recording_seconds }}
        run: |
          set -Eeuo pipefail

          cmatrix_ref="${REQUESTED_REF:-master}"
          recording_seconds="${REQUESTED_SECONDS:-12}"

          if ! [[ "$recording_seconds" =~ ^[0-9]+$ ]]
          then
            printf '%s\n' "recording_seconds must be an integer." >&2
            exit 1
          fi

          if test "$recording_seconds" -lt 3 || test "$recording_seconds" -gt 60
          then
            printf '%s\n' "recording_seconds must be between 3 and 60." >&2
            exit 1
          fi

          printf 'cmatrix_ref=%s\n' "$cmatrix_ref" >> "$GITHUB_OUTPUT"
          printf 'recording_seconds=%s\n' "$recording_seconds" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            git \
            libncurses-dev \
            libncursesw5-dev \
            libtool \
            pkg-config \
            python3

      - name: Clone upstream cmatrix fresh
        shell: bash
        env:
          CMATRIX_REF: ${{ steps.inputs.outputs.cmatrix_ref }}
        run: |
          set -Eeuo pipefail

          rm -rf "$CMATRIX_SOURCE_DIR"
          mkdir -p "$(dirname "$CMATRIX_SOURCE_DIR")"

          git clone \
            "$CMATRIX_REPOSITORY" \
            "$CMATRIX_SOURCE_DIR"

          git -C "$CMATRIX_SOURCE_DIR" fetch --force --prune --tags origin

          if git -C "$CMATRIX_SOURCE_DIR" rev-parse --verify --quiet "${CMATRIX_REF}^{commit}" >/dev/null
          then
            resolved_ref="${CMATRIX_REF}^{commit}"
          elif git -C "$CMATRIX_SOURCE_DIR" rev-parse --verify --quiet "origin/${CMATRIX_REF}^{commit}" >/dev/null
          then
            resolved_ref="origin/${CMATRIX_REF}^{commit}"
          else
            git -C "$CMATRIX_SOURCE_DIR" fetch --depth=1 origin "$CMATRIX_REF"
            resolved_ref="FETCH_HEAD"
          fi

          git -C "$CMATRIX_SOURCE_DIR" checkout --force --detach "$resolved_ref"
          git -C "$CMATRIX_SOURCE_DIR" clean -ffdx

          printf '%s\n' "$(git -C "$CMATRIX_SOURCE_DIR" rev-parse HEAD)" \
            > "$RUNNER_TEMP/cmatrix-upstream-commit.txt"

      - name: Build upstream cmatrix with ncursesw
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$CMATRIX_INSTALL_DIR"
          mkdir -p "$CMATRIX_INSTALL_DIR"
          cd "$CMATRIX_SOURCE_DIR"

          if test -x ./autogen.sh
          then
            ./autogen.sh
          else
            autoreconf --install --force
          fi

          ncurses_cflags="$(pkg-config --cflags ncursesw)"
          ncurses_libs="$(pkg-config --libs ncursesw)"

          CPPFLAGS="$ncurses_cflags -D_XOPEN_SOURCE_EXTENDED=1" \
          CFLAGS="-O2 -pipe" \
          LIBS="$ncurses_libs" \
          ./configure \
            --prefix="$CMATRIX_INSTALL_DIR" \
            --bindir="$CMATRIX_INSTALL_DIR/bin" \
            --disable-dependency-tracking

          if ! grep -Eq -- '-lncursesw|-lcursesw' Makefile
          then
            sed -i 's/-lncurses/-lncursesw/g' Makefile
          fi

          make clean || true
          make V=1 --jobs="$(getconf _NPROCESSORS_ONLN)"
          make install

          test -x "$CMATRIX_INSTALL_DIR/bin/cmatrix"
          ldd "$CMATRIX_INSTALL_DIR/bin/cmatrix" | grep -q 'libncursesw'

      - name: Record native upstream cmatrix PTY output
        shell: bash
        env:
          RECORDING_SECONDS: ${{ steps.inputs.outputs.recording_seconds }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$CMATRIX_RECORDING_DIR"

          CMATRIX_BINARY="$CMATRIX_INSTALL_DIR/bin/cmatrix" \
          CMATRIX_OUTPUT="$CMATRIX_RECORDING_FILE" \
          CMATRIX_SECONDS="$RECORDING_SECONDS" \
          CMATRIX_COMMIT="$(cat "$RUNNER_TEMP/cmatrix-upstream-commit.txt")" \
          python3 - <<'PY'
          import base64
          import json
          import os
          import pty
          import select
          import signal
          import struct
          import termios
          import time
          import fcntl
          from datetime import datetime, timezone
          from pathlib import Path

          binary = os.environ["CMATRIX_BINARY"]
          output = Path(os.environ["CMATRIX_OUTPUT"])
          seconds = int(os.environ["CMATRIX_SECONDS"])
          commit = os.environ["CMATRIX_COMMIT"]
          columns = 120
          rows = 40

          pid, master_fd = pty.fork()
          if pid == 0:
              os.environ["TERM"] = "xterm-256color"
              os.environ["LANG"] = "C.UTF-8"
              os.execv(binary, [binary, "-b", "-u", "2"])

          fcntl.ioctl(master_fd, termios.TIOCSWINSZ, struct.pack("HHHH", rows, columns, 0, 0))
          os.set_blocking(master_fd, False)

          frames = []
          started = time.monotonic()
          previous = started

          try:
              while time.monotonic() - started < seconds:
                  ready, _, _ = select.select([master_fd], [], [], 0.05)
                  if not ready:
                      continue
                  try:
                      data = os.read(master_fd, 65536)
                  except BlockingIOError:
                      continue
                  except OSError:
                      break
                  if not data:
                      break
                  current = time.monotonic()
                  delay_ms = max(5, min(2000, round((current - previous) * 1000)))
                  previous = current
                  frames.append({
                      "delay_ms": delay_ms,
                      "data": base64.b64encode(data).decode("ascii"),
                  })
          finally:
              try:
                  os.kill(pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              time.sleep(0.1)
              try:
                  os.kill(pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              try:
                  os.waitpid(pid, 0)
              except ChildProcessError:
                  pass
              os.close(master_fd)

          if not frames:
              raise SystemExit("upstream cmatrix produced no PTY frames")

          payload = {
              "schema": "speciedex.cmatrix.recording.v1",
              "generator": "https://github.com/abishekvashok/cmatrix",
              "upstream_repository": "https://github.com/abishekvashok/cmatrix.git",
              "upstream_commit": commit,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "columns": columns,
              "rows": rows,
              "duration_seconds": seconds,
              "frame_count": len(frames),
              "loop": True,
              "frames": frames,
          }

          output.write_text(json.dumps(payload, separators=(",", ":")) + "\n", encoding="utf-8")
          print(f"wrote {len(frames)} frames to {output}")
          PY

          test -s "$CMATRIX_RECORDING_FILE"

      - name: Validate browser assets and recording
        shell: bash
        run: |
          set -Eeuo pipefail

          node --check static/js/terminal/cmatrix.js
          node --check static/js/terminal/visualization/terminal-cmatrix.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("static/data/cmatrix/cmatrix-recording.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == "speciedex.cmatrix.recording.v1"
          assert payload["frame_count"] == len(payload["frames"])
          assert payload["frame_count"] > 0
          print(f"validated {payload['frame_count']} cmatrix frames")
          PY

      - name: Commit refreshed cmatrix recording
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet -- static/data/cmatrix/cmatrix-recording.json
          then
            printf '%s\n' "cmatrix recording is unchanged."
            exit 0
          fi

          git config user.name "speciedex-actions[bot]"
          git config user.email "speciedex-actions[bot]@users.noreply.github.com"

          git add static/data/cmatrix/cmatrix-recording.json
          git commit -m "Update upstream cmatrix browser recording [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload cmatrix recording artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmatrix-recording-${{ github.run_number }}
          path: static/data/cmatrix/cmatrix-recording.json
          if-no-files-found: error
          retention-days: 30
