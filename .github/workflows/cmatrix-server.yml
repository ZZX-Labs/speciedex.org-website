name: cmatrix server

run-name: >-
  cmatrix server ·
  ${{ github.event_name }} ·
  ${{ github.ref_name }} ·
  ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      cmatrix_ref:
        description: Upstream cmatrix branch, tag, or commit
        required: false
        default: master
        type: string

  push:
    branches:
      - main
    paths:
      - "static/tools/cmatrix-server/**"
      - "static/js/terminal/cmatrix.js"
      - "static/js/terminal/visualization/terminal-cmatrix.js"
      - ".github/workflows/cmatrix-server.yml"

  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: cmatrix-server-${{ github.ref }}
  cancel-in-progress: true

env:
  CMATRIX_REPOSITORY: https://github.com/abishekvashok/cmatrix.git
  CMATRIX_SOURCE_DIR: ${{ github.workspace }}/.upstream/cmatrix
  CMATRIX_INSTALL_DIR: ${{ github.workspace }}/.runtime/cmatrix
  CMATRIX_SERVER_DIR: ${{ github.workspace }}/static/tools/cmatrix-server
  CMATRIX_HOST: 127.0.0.1
  CMATRIX_PORT: "8765"
  CMATRIX_ALLOWED_ORIGINS: https://speciedex.org
  CMATRIX_MAX_SESSIONS: "32"
  CMATRIX_IDLE_TIMEOUT: "900"

jobs:
  build-and-test:
    name: Clone, build, and test upstream cmatrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Speciedex
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve upstream cmatrix ref
        id: upstream
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.cmatrix_ref }}
        run: |
          set -Eeuo pipefail

          requested_ref="${REQUESTED_REF:-master}"

          printf 'ref=%s\n' "$requested_ref" >> "$GITHUB_OUTPUT"
          printf 'Using upstream cmatrix ref: %s\n' "$requested_ref"

      - name: Install build and runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install \
            --yes \
            --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            curl \
            git \
            libncurses-dev \
            libncursesw5-dev \
            libtool \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv

      - name: Clone upstream cmatrix repository
        shell: bash
        env:
          CMATRIX_REF: ${{ steps.upstream.outputs.ref }}
        run: |
          set -Eeuo pipefail

          rm -rf "$CMATRIX_SOURCE_DIR"
          mkdir -p "$(dirname "$CMATRIX_SOURCE_DIR")"

          git clone \
            "$CMATRIX_REPOSITORY" \
            "$CMATRIX_SOURCE_DIR"

          git \
            -C "$CMATRIX_SOURCE_DIR" \
            fetch \
            --force \
            --prune \
            --tags \
            origin

          if git \
            -C "$CMATRIX_SOURCE_DIR" \
            rev-parse \
            --verify \
            --quiet \
            "${CMATRIX_REF}^{commit}" \
            >/dev/null
          then
            resolved_ref="${CMATRIX_REF}^{commit}"
          elif git \
            -C "$CMATRIX_SOURCE_DIR" \
            rev-parse \
            --verify \
            --quiet \
            "origin/${CMATRIX_REF}^{commit}" \
            >/dev/null
          then
            resolved_ref="origin/${CMATRIX_REF}^{commit}"
          else
            git \
              -C "$CMATRIX_SOURCE_DIR" \
              fetch \
              --depth=1 \
              origin \
              "$CMATRIX_REF"

            resolved_ref="FETCH_HEAD"
          fi

          git \
            -C "$CMATRIX_SOURCE_DIR" \
            checkout \
            --force \
            --detach \
            "$resolved_ref"

          git \
            -C "$CMATRIX_SOURCE_DIR" \
            clean \
            -ffdx

          printf 'Repository: %s\n' "$CMATRIX_REPOSITORY"
          printf 'Requested ref: %s\n' "$CMATRIX_REF"
          printf 'Resolved commit: %s\n' \
            "$(git -C "$CMATRIX_SOURCE_DIR" rev-parse HEAD)"
          printf 'Description: %s\n' \
            "$(git -C "$CMATRIX_SOURCE_DIR" describe --always --tags)"

      - name: Build upstream cmatrix with ncursesw
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$CMATRIX_INSTALL_DIR"
          mkdir -p "$CMATRIX_INSTALL_DIR"

          cd "$CMATRIX_SOURCE_DIR"

          if test -x ./autogen.sh
          then
            ./autogen.sh
          else
            autoreconf \
              --install \
              --force
          fi

          ncurses_cflags="$(pkg-config --cflags ncursesw)"
          ncurses_libs="$(pkg-config --libs ncursesw)"

          printf 'ncursesw CFLAGS: %s\n' "$ncurses_cflags"
          printf 'ncursesw LIBS: %s\n' "$ncurses_libs"

          CPPFLAGS="$ncurses_cflags -D_XOPEN_SOURCE_EXTENDED=1" \
          CFLAGS="-O2 -pipe" \
          LIBS="$ncurses_libs" \
          ./configure \
            --prefix="$CMATRIX_INSTALL_DIR" \
            --bindir="$CMATRIX_INSTALL_DIR/bin" \
            --disable-dependency-tracking

          if ! grep -Eq -- '-lncursesw|-lcursesw' Makefile
          then
            printf '%s\n' \
              "configure selected narrow ncurses; forcing ncursesw linkage."

            sed \
              -i \
              's/-lncurses/-lncursesw/g' \
              Makefile
          fi

          printf '%s\n' "Resolved linker settings:"
          grep \
            -E \
            '^(LIBS|LDADD|cmatrix_LDADD)[[:space:]]*=' \
            Makefile \
            || true

          make clean || true

          make \
            V=1 \
            --jobs="$(getconf _NPROCESSORS_ONLN)"

          make install

      - name: Verify upstream cmatrix binary
        shell: bash
        run: |
          set -Eeuo pipefail

          cmatrix_binary="$CMATRIX_INSTALL_DIR/bin/cmatrix"

          test -x "$cmatrix_binary"

          file "$cmatrix_binary"
          sha256sum "$cmatrix_binary"

          if command -v ldd >/dev/null 2>&1
          then
            ldd "$cmatrix_binary"

            if ! ldd "$cmatrix_binary" | grep -q 'libncursesw'
            then
              printf '%s\n' \
                "The cmatrix binary is not linked against libncursesw." \
                >&2
              exit 1
            fi
          fi

          timeout 2 \
            "$cmatrix_binary" \
            -V \
            || true

      - name: Install cmatrix PTY server runtime
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s "$CMATRIX_SERVER_DIR/cmatrix-server.py"
          test -s "$CMATRIX_SERVER_DIR/requirements.txt"

          python3 \
            -m venv \
            "$RUNNER_TEMP/cmatrix-server-venv"

          "$RUNNER_TEMP/cmatrix-server-venv/bin/python" \
            -m pip \
            install \
            --disable-pip-version-check \
            --upgrade \
            pip \
            setuptools \
            wheel

          "$RUNNER_TEMP/cmatrix-server-venv/bin/python" \
            -m pip \
            install \
            --disable-pip-version-check \
            --requirement \
            "$CMATRIX_SERVER_DIR/requirements.txt"

          "$RUNNER_TEMP/cmatrix-server-venv/bin/python" \
            -m py_compile \
            "$CMATRIX_SERVER_DIR/cmatrix-server.py"

      - name: Start cmatrix PTY server
        shell: bash
        env:
          CMATRIX_EXECUTABLE: ${{ github.workspace }}/.runtime/cmatrix/bin/cmatrix
        run: |
          set -Eeuo pipefail

          log_file="$RUNNER_TEMP/cmatrix-server.log"
          pid_file="$RUNNER_TEMP/cmatrix-server.pid"

          nohup \
            "$RUNNER_TEMP/cmatrix-server-venv/bin/python" \
            "$CMATRIX_SERVER_DIR/cmatrix-server.py" \
            >"$log_file" \
            2>&1 \
            &

          server_pid="$!"
          printf '%s\n' "$server_pid" > "$pid_file"
          printf 'Started cmatrix PTY server with PID %s\n' "$server_pid"

      - name: Verify cmatrix PTY server
        shell: bash
        run: |
          set -Eeuo pipefail

          log_file="$RUNNER_TEMP/cmatrix-server.log"

          for attempt in $(seq 1 30)
          do
            if curl \
              --fail \
              --silent \
              --show-error \
              "http://${CMATRIX_HOST}:${CMATRIX_PORT}/healthz"
            then
              printf '\n%s\n' \
                "cmatrix PTY server health check passed."
              exit 0
            fi

            sleep 1
          done

          printf '%s\n' \
            "cmatrix PTY server failed its health check."

          if test -s "$log_file"
          then
            cat "$log_file"
          fi

          exit 1

      - name: Run browser JavaScript syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail

          node --check \
            static/js/terminal/cmatrix.js

          node --check \
            static/js/terminal/visualization/terminal-cmatrix.js

      - name: Show cmatrix server log
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          log_file="$RUNNER_TEMP/cmatrix-server.log"

          if test -s "$log_file"
          then
            cat "$log_file"
          else
            printf '%s\n' \
              "No cmatrix server log was created."
          fi

      - name: Stop cmatrix PTY server
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          pid_file="$RUNNER_TEMP/cmatrix-server.pid"

          if test -s "$pid_file"
          then
            server_pid="$(cat "$pid_file")"

            if kill -0 "$server_pid" 2>/dev/null
            then
              kill "$server_pid"
              wait "$server_pid" 2>/dev/null || true
            fi
          fi