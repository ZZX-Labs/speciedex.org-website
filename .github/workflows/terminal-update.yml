name: Terminal Full Database Update Request

run-name: >-
  Terminal full refresh ·
  ${{ github.event.client_payload.request_id || inputs.request_id || github.run_id }}

on:
  repository_dispatch:
    types:
      - speciedex-terminal-full-update

  workflow_dispatch:
    inputs:
      request_id:
        description: Optional terminal request identifier for manual testing
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: speciedex-terminal-full-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-request:
    name: Validate all-provider terminal request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      request_id: ${{ steps.validate.outputs.request_id }}
      requested_by: ${{ steps.validate.outputs.requested_by }}

    steps:
      - name: Enforce exact full-provider request contract
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id || '' }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path
          from typing import Any

          event_name = os.environ["EVENT_NAME"]
          payload: dict[str, Any] = {}

          if event_name == "repository_dispatch":
              try:
                  decoded = json.loads(
                      os.environ.get("DISPATCH_PAYLOAD", "null")
                  )
              except json.JSONDecodeError as error:
                  raise SystemExit(
                      "Invalid repository_dispatch client_payload JSON."
                  ) from error

              if not isinstance(decoded, dict):
                  raise SystemExit(
                      "repository_dispatch client_payload must be an object."
                  )

              payload = decoded
              allowed_fields = {
                  "scope",
                  "request_id",
                  "requested_by",
              }
              unknown_fields = sorted(set(payload) - allowed_fields)

              if unknown_fields:
                  raise SystemExit(
                      "Unsupported terminal request fields: "
                      + ", ".join(unknown_fields)
                  )

              scope = str(payload.get("scope") or "").strip().lower()

              if scope != "all_providers":
                  raise SystemExit(
                      "Terminal requests must use scope=all_providers."
                  )

          request_id = (
              str(payload.get("request_id") or "").strip()
              or os.environ.get("MANUAL_REQUEST_ID", "").strip()
              or f"terminal-{os.environ['GITHUB_RUN_ID']}"
          )

          if len(request_id) > 96:
              raise SystemExit("request_id exceeds 96 characters.")

          if not re.fullmatch(r"[A-Za-z0-9._:@/-]+", request_id):
              raise SystemExit(
                  "request_id contains unsupported characters."
              )

          requested_by = (
              str(payload.get("requested_by") or "").strip()
              or os.environ.get("GITHUB_ACTOR", "unknown").strip()
              or "unknown"
          )
          requested_by = re.sub(
              r"[^A-Za-z0-9._:@/-]+",
              "-",
              requested_by,
          ).strip("-")[:96] or "unknown"

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"request_id={request_id}\n")
              output.write(f"requested_by={requested_by}\n")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("# Terminal update request accepted\n\n")
              summary.write(f"- Request: `{request_id}`\n")
              summary.write(f"- Requested by: `{requested_by}`\n")
              summary.write("- Scope: `all_providers`\n")
              summary.write("- Provider selection: disabled\n")
              summary.write("- Expected providers: 77\n")
              summary.write("- Execution model: one singular provider pass\n")
          PY

  publish-queued-status:
    name: Publish queued terminal status
    needs:
      - validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize status branch
        run: |
          set -Eeuo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Write queued status record
        env:
          REQUEST_ID: ${{ needs.validate-request.outputs.request_id }}
          REQUESTED_BY: ${{ needs.validate-request.outputs.requested_by }}
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          now = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )

          payload = {
              "schema_version": 1,
              "request_id": os.environ["REQUEST_ID"].strip(),
              "request_origin": "terminal",
              "requested_by": os.environ["REQUESTED_BY"].strip(),
              "requested_at": now,
              "scope": "all_providers",
              "provider_count_expected": 77,
              "provider_count_actual": 0,
              "icon_count": 0,
              "single_pass": True,
              "status": "queued",
              "components": {
                  "statistics": "pending",
                  "icons": "pending",
                  "database": "pending",
              },
              "generated_at": now,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              ),
          }

          path = Path("static/data/terminal-update-status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          temporary = path.with_suffix(path.suffix + ".tmp")
          temporary.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          temporary.replace(path)
          PY

      - name: Commit queued status record
        env:
          REQUEST_ID: ${{ needs.validate-request.outputs.request_id }}
        run: |
          set -Eeuo pipefail

          git config user.name "speciedex-terminal-bot"
          git config user.email \
            "speciedex-terminal-bot@users.noreply.github.com"

          git add static/data/terminal-update-status.json

          if git diff --cached --quiet
          then
            printf '%s\n' "Queued terminal status is unchanged."
            exit 0
          fi

          git commit \
            -m "chore(terminal): queue full database refresh" \
            -m "Request: ${REQUEST_ID}"

          for attempt in 1 2 3
          do
            if git pull --rebase origin main && \
               git push origin HEAD:main
            then
              printf '%s\n' "Queued terminal status published."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 5))"
          done

          printf '%s\n' "Unable to publish queued terminal status." >&2
          exit 1

  update-database:
    name: Execute full Speciedex refresh
    needs:
      - validate-request
      - publish-queued-status
    uses: ./.github/workflows/update-database.yml
    with:
      request_id: ${{ needs.validate-request.outputs.request_id }}
      request_origin: terminal
      requested_by: ${{ needs.validate-request.outputs.requested_by }}
    secrets: inherit
