name: Update Speciedex Public Taxonomic Archive

run-name: >-
  Taxonomic archive · all 77 providers ·
  ${{ inputs.request_origin || github.event_name }} ·
  ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional request identifier for audit and terminal status records
        required: false
        default: ""
        type: string
      request_origin:
        description: Origin of the complete 77-provider scan
        required: false
        default: manual
        type: choice
        options:
          - manual
          - scheduled
          - database
          - terminal
          - maintenance
      target_ref:
        description: Branch receiving generated archive products
        required: false
        default: main
        type: string

  workflow_call:
    inputs:
      request_id:
        description: Request identifier propagated by the calling workflow
        required: false
        default: ""
        type: string
      request_origin:
        description: Origin propagated by the calling workflow
        required: false
        default: workflow
        type: string
      target_ref:
        description: Branch receiving generated archive products
        required: false
        default: main
        type: string
      orchestrated:
        description: Mark a scan invoked by update-database.yml
        required: false
        default: false
        type: boolean
    outputs:
      request_id:
        description: Normalized request identifier
        value: ${{ jobs.update.outputs.request_id }}
      provider_count:
        description: Number of registered and validated providers accounted for
        value: ${{ jobs.update.outputs.provider_count }}
      eligible_count:
        description: Number of providers executable during this registry-wide pass
        value: ${{ jobs.update.outputs.eligible_count }}
      skipped_count:
        description: Number of registered providers blocked by runtime prerequisites
        value: ${{ jobs.update.outputs.skipped_count }}
      archive_changed:
        description: Whether static/data changed during the scan
        value: ${{ jobs.update.outputs.archive_changed }}


  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: speciedex-taxonomy-update-${{ inputs.target_ref || github.ref_name || github.event.repository.default_branch }}
  cancel-in-progress: ${{ inputs.request_origin == 'terminal' }}

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Scan all 77 providers and update taxonomic archive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      provider_count: ${{ steps.provider_registry.outputs.provider_count }}
      eligible_count: ${{ steps.provider_availability.outputs.eligible_count }}
      skipped_count: ${{ steps.provider_availability.outputs.skipped_count }}
      archive_changed: ${{ steps.archive_changes.outputs.changed }}

    env:
      PYTHONUNBUFFERED: "1"
      TARGET_REF: ${{ inputs.target_ref || github.event.repository.default_branch }}
      REQUEST_ID_INPUT: ${{ inputs.request_id || '' }}
      REQUEST_ORIGIN: ${{ inputs.request_origin || github.event_name }}
      ORCHESTRATED: ${{ inputs.orchestrated || false }}

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize request metadata
        id: request
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          request_id = (
              os.environ.get("REQUEST_ID_INPUT", "").strip()
              or f"statistics-{os.environ['GITHUB_RUN_ID']}"
          )

          if len(request_id) > 96:
              raise SystemExit("request_id exceeds 96 characters.")

          if not re.fullmatch(r"[A-Za-z0-9._:@/-]+", request_id):
              raise SystemExit(
                  "request_id contains unsupported characters."
              )

          origin = os.environ.get("REQUEST_ORIGIN", "").strip()
          if not origin:
              origin = "unknown"

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"request_id={request_id}\n")
              output.write(f"request_origin={origin}\n")

          with Path(os.environ["GITHUB_ENV"]).open(
              "a",
              encoding="utf-8",
          ) as environment:
              environment.write(f"REQUEST_ID={request_id}\n")
              environment.write(f"REQUEST_ORIGIN={origin}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: true

      - name: Restore derived SQLite index cache
        id: sqlite_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            static/data/taxonomy/index.sqlite3
          key: speciedex-sqlite-${{ runner.os }}-${{ env.TARGET_REF }}-${{ github.run_id }}
          restore-keys: |
            speciedex-sqlite-${{ runner.os }}-${{ env.TARGET_REF }}-

      - name: Load optional provider credentials
        id: provider_credentials
        shell: bash
        env:
          SECRET_EOL_API_KEY: ${{ secrets.EOL_API_KEY }}
          SECRET_IUCN_API_TOKEN: ${{ secrets.IUCN_API_TOKEN }}
          SECRET_NATURESERVE_API_KEY: ${{ secrets.NATURESERVE_API_KEY }}
          SECRET_NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SECRET_BACDIVE_USERNAME: ${{ secrets.BACDIVE_USERNAME }}
          SECRET_BACDIVE_PASSWORD: ${{ secrets.BACDIVE_PASSWORD }}
          SECRET_BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
          SECRET_GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
          SECRET_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SECRET_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          loaded=()
          missing=()

          export_secret() {
            local source_name="$1"
            local target_name="$2"
            local value="${!source_name:-}"

            if test -n "$value"
            then
              printf '%s=%s\n' \
                "$target_name" \
                "$value" \
                >> "$GITHUB_ENV"

              loaded+=("$target_name")
            else
              missing+=("$target_name")
            fi
          }

          export_secret SECRET_EOL_API_KEY EOL_API_KEY
          export_secret SECRET_IUCN_API_TOKEN IUCN_API_TOKEN
          export_secret SECRET_NATURESERVE_API_KEY NATURESERVE_API_KEY
          export_secret SECRET_NCBI_API_KEY NCBI_API_KEY
          export_secret SECRET_BACDIVE_USERNAME BACDIVE_USERNAME
          export_secret SECRET_BACDIVE_PASSWORD BACDIVE_PASSWORD
          export_secret SECRET_BHL_API_KEY BHL_API_KEY
          export_secret SECRET_GEONAMES_USERNAME GEONAMES_USERNAME
          export_secret SECRET_YOUTUBE_API_KEY YOUTUBE_API_KEY
          export_secret SECRET_GOOGLE_API_KEY GOOGLE_API_KEY

          printf 'loaded_count=%s\n' \
            "${#loaded[@]}" \
            >> "$GITHUB_OUTPUT"

          printf 'missing_count=%s\n' \
            "${#missing[@]}" \
            >> "$GITHUB_OUTPUT"

          printf 'Loaded optional credentials: %s\n' \
            "${loaded[*]:-none}"

          printf 'Unavailable optional credentials: %s\n' \
            "${missing[*]:-none}"

      - name: Validate Python source
        run: |
          python -m py_compile static/tools/stat-grabber.py
          python -m compileall -q \
            static/tools/core \
            static/tools/providers

      - name: Validate provider registry
        run: |
          python -m json.tool \
            static/tools/providers.json \
            >/dev/null

      - name: Verify exact 77-provider module coverage
        id: provider_registry
        run: |
          python - <<'PY'
          import importlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          repo_root = Path.cwd()
          tools_root = repo_root / "static" / "tools"
          providers_root = tools_root / "providers"
          registry_path = tools_root / "providers.json"

          sys.path.insert(
              0,
              str(tools_root),
          )

          registry = json.loads(
              registry_path.read_text(
                  encoding="utf-8"
              )
          )

          providers = registry.get("providers")

          if not isinstance(providers, list):
              raise SystemExit(
                  "providers.json does not contain a providers list."
              )

          valid_name = re.compile(
              r"^[a-z0-9_]+$"
          )

          names = []
          invalid = []
          duplicates = []
          missing = []
          import_failures = []
          missing_classes = []
          provider_name_mismatches = []
          missing_fetch = []
          disabled = []

          for definition in providers:
              if not isinstance(definition, dict):
                  invalid.append(repr(definition))
                  continue

              name = str(
                  definition.get("name", "")
              ).strip()

              if not valid_name.fullmatch(name):
                  invalid.append(name)
                  continue

              if name in names:
                  duplicates.append(name)
                  continue

              names.append(name)

              if definition.get("enabled", True) is not True:
                  disabled.append(name)

              module_path = (
                  providers_root
                  / f"{name}.py"
              )

              if not module_path.is_file():
                  missing.append(
                      module_path.as_posix()
                  )
                  continue

              module_name = str(
                  definition.get(
                      "module",
                      f"providers.{name}",
                  )
              ).strip()

              try:
                  module = importlib.import_module(
                      module_name
                  )
              except Exception as error:
                  import_failures.append(
                      f"{module_name}: "
                      f"{type(error).__name__}: {error}"
                  )
                  continue

              provider_class = getattr(
                  module,
                  "Provider",
                  None,
              )

              if provider_class is None:
                  missing_classes.append(
                      module_path.as_posix()
                  )
                  continue

              provider_name = str(
                  getattr(
                      provider_class,
                      "PROVIDER_NAME",
                      "",
                  )
              ).strip()

              if provider_name != name:
                  provider_name_mismatches.append(
                      f"{module_name}: "
                      f"PROVIDER_NAME={provider_name!r}, "
                      f"expected {name!r}"
                  )

              if not callable(
                  getattr(
                      provider_class,
                      "fetch",
                      None,
                  )
              ):
                  missing_fetch.append(
                      module_path.as_posix()
                  )

          errors = []

          if invalid:
              errors.append(
                  "Invalid provider names or entries:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in invalid
                  )
              )

          if duplicates:
              errors.append(
                  "Duplicate provider names:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in duplicates
                  )
              )

          if missing:
              errors.append(
                  "Missing provider modules:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in missing
                  )
              )

          if import_failures:
              errors.append(
                  "Provider import failures:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in import_failures
                  )
              )

          if missing_classes:
              errors.append(
                  "Provider modules missing Provider class:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in missing_classes
                  )
              )

          if provider_name_mismatches:
              errors.append(
                  "Provider name mismatches:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in provider_name_mismatches
                  )
              )

          if missing_fetch:
              errors.append(
                  "Provider classes missing fetch():\n"
                  + "\n".join(
                      f"  {value}"
                      for value in missing_fetch
                  )
              )

          if disabled:
              errors.append(
                  "All 77 providers must be enabled for a complete pass:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in disabled
                  )
              )

          expected_provider_names = {
              "wikipedia",
              "wikispecies",
              "gbif",
              "itis",
              "worms",
              "inaturalist",
              "wikidata",
              "catalogue_of_life",
              "open_tree_of_life",
              "eol",
              "iucn_red_list",
              "iucn_green_status",
              "iucn_green_list",
              "ncbi_taxonomy",
              "world_flora_online",
              "powo",
              "ipni",
              "tropicos",
              "grin_taxonomy",
              "usda_plants",
              "euro_med_plantbase",
              "zoobank",
              "index_fungorum",
              "mycobank",
              "species_fungorum",
              "irmng",
              "fishbase",
              "sealifebase",
              "algaebase",
              "paleobiology",
              "bold",
              "global_names",
              "gnub",
              "obis",
              "ebird",
              "avibase",
              "ioc_world_bird_list",
              "mammal_diversity_database",
              "reptile_database",
              "amphibiaweb",
              "amphibian_species_world",
              "world_spider_catalog",
              "antcat",
              "antweb",
              "orthoptera_species_file",
              "odonata_central",
              "ala",
              "canadensys",
              "idigbio",
              "natureserve",
              "species_plus",
              "cms_species",
              "silva",
              "unite",
              "gtdb",
              "lpsn",
              "bacdive",
              "ictv",
              "viralzone",
              "uniprot_taxonomy",
              "ena",
              "genbank",
              "molluscabase",
              "world_echinoderm_database",
              "bryozoa_net",
              "fao_asfis",
              "plazi_treatmentbank",
              "biodiversity_heritage_library",
              "crossref",
              "openalex",
              "geonames",
              "marine_regions",
              "wdpa",
              "key_biodiversity_areas",
              "darwin_core_archive",
              "generic_jsonl",
              "youtube",
          }

          actual_provider_names = set(names)
          missing_registry_names = sorted(
              expected_provider_names - actual_provider_names
          )
          unexpected_registry_names = sorted(
              actual_provider_names - expected_provider_names
          )

          if missing_registry_names:
              errors.append(
                  "Missing canonical provider registry entries:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in missing_registry_names
                  )
              )

          if unexpected_registry_names:
              errors.append(
                  "Unexpected provider registry entries:\n"
                  + "\n".join(
                      f"  {value}"
                      for value in unexpected_registry_names
                  )
              )

          expected_provider_count = len(expected_provider_names)

          if len(names) != expected_provider_count:
              errors.append(
                  "Provider registry count mismatch: "
                  f"expected {expected_provider_count}, "
                  f"found {len(names)}."
              )

          if errors:
              raise SystemExit(
                  "\n\n".join(errors)
              )

          print(
              f"Validated {len(names)} enabled "
              "provider modules for one singular pass."
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"provider_count={len(names)}\n")
          PY

      - name: Rebuild missing derived SQLite index
        if: steps.sqlite_cache.outputs.cache-hit != 'true'
        run: |
          python static/tools/stat-grabber.py \
            reindex \
            --history-limit 1008

      - name: Inspect all-provider runtime availability
        id: provider_availability
        run: |
          set -Eeuo pipefail

          availability="$RUNNER_TEMP/speciedex-provider-availability.json"

          python static/tools/stat-grabber.py \
            providers \
            > "$availability"

          cat "$availability"

          PROVIDER_AVAILABILITY="$availability" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PROVIDER_AVAILABILITY"])
          payload = json.loads(path.read_text(encoding="utf-8"))

          eligible = payload.get("eligible")
          skipped = payload.get("skipped")

          if not isinstance(eligible, list):
              raise SystemExit("Provider availability output has no eligible list.")
          if not isinstance(skipped, list):
              raise SystemExit("Provider availability output has no skipped list.")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"eligible_count={len(eligible)}\n")
              output.write(f"skipped_count={len(skipped)}\n")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Provider execution availability\n\n")
              summary.write(f"- Registered and validated: 77\n")
              summary.write(f"- Executable now: {len(eligible)}\n")
              summary.write(f"- Blocked or unavailable: {len(skipped)}\n\n")

              if skipped:
                  summary.write("| Provider | Reason |\n")
                  summary.write("|---|---|\n")
                  for item in skipped:
                      if not isinstance(item, dict):
                          continue
                      provider = str(item.get("provider") or "unknown")
                      reason = str(item.get("reason") or "unspecified")
                      summary.write(f"| `{provider}` | {reason} |\n")

          expected = 77
          accounted = len(eligible) + len(skipped)

          if accounted != expected:
              raise SystemExit(
                  "Provider accounting contract not met: "
                  f"expected {expected} registered providers to be classified, "
                  f"found {accounted}; executable={len(eligible)}; "
                  f"blocked={len(skipped)}."
              )

          if not eligible:
              raise SystemExit(
                  "No providers are currently executable; the all-provider "
                  "registry pass would perform no ingestion work."
              )

          print(
              "All-provider registry contract satisfied: "
              f"registered={expected}, executable={len(eligible)}, "
              f"blocked={len(skipped)}."
          )
          PY

      - name: Run one all-provider registry pass
        run: |
          python static/tools/stat-grabber.py \
            scan \
            --all-providers \
            --batch-size 5000 \
            --timeout 40 \
            --retries 5 \
            --backoff 2 \
            --volume-target-mb 48 \
            --volume-max-mb 90 \
            --history-limit 1008 \
            --verbose

      - name: Rebuild statistics from complete archive
        run: |
          python static/tools/stat-grabber.py \
            reindex \
            --history-limit 1008

      - name: Verify taxonomic archive
        run: |
          python static/tools/stat-grabber.py \
            verify

      - name: Validate generated JSON
        run: |
          python -m json.tool \
            static/data/statistics.json \
            >/dev/null

          python -m json.tool \
            static/data/statistics-sources.json \
            >/dev/null

          python -m json.tool \
            static/data/statistics-history.json \
            >/dev/null

          if test -f \
            static/data/taxonomy/manifest.json
          then
            python -m json.tool \
              static/data/taxonomy/manifest.json \
              >/dev/null
          fi

          if test -f \
            static/data/taxonomy/scheduler.json
          then
            python -m json.tool \
              static/data/taxonomy/scheduler.json \
              >/dev/null
          fi

          if test -d \
            static/data/taxonomy/provider-state
          then
            find \
              static/data/taxonomy/provider-state \
              -type f \
              -name "*.json" \
              -print0 |
            while IFS= read -r -d '' file
            do
              python -m json.tool \
                "$file" \
                >/dev/null
            done
          fi

      - name: Validate and normalize scheduler state
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          path = Path(
              "static/data/taxonomy/scheduler.json"
          )

          if not path.exists():
              print(
                  "No scheduler state file exists yet."
              )
              raise SystemExit(0)

          state = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(state, dict):
              raise SystemExit(
                  "Scheduler state root must be an object."
              )

          changed = False

          def integer_value(value, *, field, minimum=0):
              nonlocal_changed = False

              if isinstance(value, bool):
                  raise SystemExit(
                      f"Scheduler field {field} cannot be boolean."
                  )

              if isinstance(value, int):
                  result = value
              elif isinstance(value, float) and value.is_integer():
                  result = int(value)
                  nonlocal_changed = True
              elif isinstance(value, str):
                  stripped = value.strip()

                  if not stripped or not stripped.lstrip("+-").isdigit():
                      raise SystemExit(
                          f"Scheduler field {field} must be an integer; "
                          f"received {value!r}."
                      )

                  result = int(stripped)
                  nonlocal_changed = True
              else:
                  raise SystemExit(
                      f"Scheduler field {field} must be an integer; "
                      f"received {value!r}."
                  )

              if result < minimum:
                  raise SystemExit(
                      f"Scheduler field {field} must be >= {minimum}; "
                      f"received {result}."
                  )

              return result, nonlocal_changed

          schema_version, migrated = integer_value(
              state.get("schema_version", 1),
              field="schema_version",
              minimum=1,
          )
          state["schema_version"] = schema_version
          changed = changed or migrated

          cursor, migrated = integer_value(
              state.get("cursor", 0),
              field="cursor",
          )
          state["cursor"] = cursor
          changed = changed or migrated

          for key in ("registered", "eligible"):
              value, migrated = integer_value(
                  state.get(key, 0),
                  field=key,
              )
              state[key] = value
              changed = changed or migrated

          providers = state.get("providers", {})

          if not isinstance(providers, dict):
              raise SystemExit(
                  "Scheduler providers must be an object."
              )

          integer_fields = (
              "consecutive_failures",
              "total_runs",
              "total_successes",
              "total_failures",
              "last_records",
              "total_records",
              "total_requests",
              "empty_successes",
          )

          for name, provider in providers.items():
              if not isinstance(provider, dict):
                  raise SystemExit(
                      f"Invalid scheduler state for {name}."
                  )

              for key in integer_fields:
                  value, migrated = integer_value(
                      provider.get(key, 0),
                      field=f"providers.{name}.{key}",
                  )
                  provider[key] = value
                  changed = changed or migrated

          if changed:
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              descriptor, temporary_name = tempfile.mkstemp(
                  prefix=f".{path.name}.",
                  suffix=".tmp",
                  dir=path.parent,
                  text=True,
              )

              try:
                  with os.fdopen(
                      descriptor,
                      "w",
                      encoding="utf-8",
                      newline="\n",
                  ) as handle:
                      json.dump(
                          state,
                          handle,
                          indent=2,
                          ensure_ascii=False,
                          sort_keys=True,
                      )
                      handle.write("\n")
                      handle.flush()
                      os.fsync(handle.fileno())

                  Path(temporary_name).replace(path)

              finally:
                  temporary = Path(temporary_name)

                  if temporary.exists():
                      temporary.unlink()

              print(
                  "Normalized scheduler numeric fields to integers."
              )

          print(
              f"Validated scheduler state for "
              f"{len(providers)} providers; "
              f"schema_version={schema_version}; "
              f"cursor={cursor}."
          )
          PY

      - name: Validate taxonomic statistics semantics
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          stats_path = Path(
              "static/data/statistics.json"
          )
          db_path = Path(
              "static/data/taxonomy/index.sqlite3"
          )

          stats = json.loads(
              stats_path.read_text(
                  encoding="utf-8"
              )
          )

          required = (
              "species",
              "subspecies",
              "genera",
              "families",
              "orders",
              "classes",
              "phyla",
              "kingdoms",
              "records_archived",
              "source_assertions",
              "rank_counts",
          )

          missing = [
              key
              for key in required
              if key not in stats
          ]

          if missing:
              raise SystemExit(
                  "Missing statistics keys: "
                  + ", ".join(missing)
              )

          aliases = {
              "genus": "genera",
              "family": "families",
              "order": "orders",
              "class": "classes",
              "phylum": "phyla",
              "kingdom": "kingdoms",
          }

          for singular, plural in aliases.items():
              if stats.get(singular) != stats.get(plural):
                  raise SystemExit(
                      "Statistics alias mismatch: "
                      f"{singular}/{plural}"
                  )

          for key in required[:-1]:
              if (
                  not isinstance(stats[key], int)
                  or stats[key] < 0
              ):
                  raise SystemExit(
                      f"Invalid statistic "
                      f"{key}: {stats[key]!r}"
                  )

          if not isinstance(
              stats["rank_counts"],
              dict,
          ):
              raise SystemExit(
                  "rank_counts must be an object."
              )

          if db_path.exists():
              db = sqlite3.connect(db_path)
              db.row_factory = sqlite3.Row

              try:
                  active_statuses = stats.get(
                      "active_statuses",
                      [
                          "accepted",
                          "valid",
                          "provisionally accepted",
                          "unknown",
                          "reference",
                      ],
                  )

                  if not isinstance(active_statuses, list):
                      raise SystemExit(
                          "active_statuses must be an array."
                      )

                  active_statuses = tuple(
                      sorted(
                          {
                              str(status).strip().casefold()
                              for status in active_statuses
                              if str(status).strip()
                          }
                      )
                  )

                  if not active_statuses:
                      raise SystemExit(
                          "active_statuses cannot be empty."
                      )

                  placeholders = ",".join(
                      "?"
                      for _ in active_statuses
                  )

                  lineage = {
                      "kingdoms": (
                          "kingdom",
                          "kingdom",
                      ),
                      "phyla": (
                          "phylum",
                          "phylum",
                      ),
                      "classes": (
                          "class_name",
                          "class",
                      ),
                      "orders": (
                          "order_name",
                          "order",
                      ),
                      "families": (
                          "family",
                          "family",
                      ),
                      "genera": (
                          "genus",
                          "genus",
                      ),
                  }

                  for key, (
                      column,
                      rank,
                  ) in lineage.items():
                      query = f"""
                          SELECT COUNT(DISTINCT name) AS count
                          FROM (
                              SELECT canonical_name AS name
                              FROM taxa
                              WHERE rank = ?
                                AND status IN ({placeholders})
                                AND canonical_name <> ''
                              UNION
                              SELECT {column} AS name
                              FROM taxa
                              WHERE status IN ({placeholders})
                                AND {column} <> ''
                          )
                      """

                      available = int(
                          db.execute(
                              query,
                              (
                                  rank,
                                  *active_statuses,
                                  *active_statuses,
                              ),
                          ).fetchone()["count"]
                      )

                      if stats[key] != available:
                          raise SystemExit(
                              f"{key} mismatch: "
                              f"statistics={stats[key]}, "
                              f"sqlite={available}"
                          )

                  species = int(
                      db.execute(
                          (
                              "SELECT COUNT(DISTINCT speciedex_id) "
                              "AS count "
                              "FROM taxa "
                              "WHERE rank = 'species' "
                              f"AND status IN ({placeholders})"
                          ),
                          active_statuses,
                      ).fetchone()["count"]
                  )

                  if stats["species"] != species:
                      raise SystemExit(
                          "species mismatch: "
                          f"statistics={stats['species']}, "
                          f"sqlite={species}"
                      )

                  subspecies = int(
                      db.execute(
                          (
                              "SELECT COUNT(DISTINCT speciedex_id) "
                              "AS count "
                              "FROM taxa "
                              "WHERE rank = 'subspecies' "
                              f"AND status IN ({placeholders})"
                          ),
                          active_statuses,
                      ).fetchone()["count"]
                  )

                  if stats["subspecies"] != subspecies:
                      raise SystemExit(
                          "subspecies mismatch: "
                          f"statistics={stats['subspecies']}, "
                          f"sqlite={subspecies}"
                      )

              finally:
                  db.close()

          print(
              json.dumps(
                  stats,
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Save derived SQLite index cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            static/data/taxonomy/index.sqlite3
          key: speciedex-sqlite-${{ runner.os }}-${{ env.TARGET_REF }}-${{ github.run_id }}

      - name: Remove derived SQLite index before Git commit
        run: |
          rm -f \
            static/data/taxonomy/index.sqlite3 \
            static/data/taxonomy/index.sqlite3-wal \
            static/data/taxonomy/index.sqlite3-shm \
            static/data/taxonomy/index.sqlite3-journal

      - name: Remove temporary SQLite files
        run: |
          if test -d static/data/taxonomy
          then
            find static/data/taxonomy \
              -type f \
              \( \
                -name "*.sqlite3-wal" \
                -o \
                -name "*.sqlite3-shm" \
                -o \
                -name "*.sqlite-journal" \
              \) \
              -delete
          fi

      - name: Check archive file sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          warning_limit = 90 * 1024 * 1024
          failure_limit = 95 * 1024 * 1024

          warnings = []
          failures = []

          sqlite_suffixes = {
              ".sqlite",
              ".sqlite3",
              ".db",
          }

          for path in Path(
              "static/data"
          ).rglob("*"):
              if not path.is_file():
                  continue

              if (
                  path.suffix.lower() in sqlite_suffixes
                  or path.name.endswith(
                      (
                          "-wal",
                          "-shm",
                          "-journal",
                      )
                  )
              ):
                  continue

              size = path.stat().st_size

              if size >= failure_limit:
                  failures.append(
                      (
                          path.as_posix(),
                          size,
                      )
                  )

              elif size >= warning_limit:
                  warnings.append(
                      (
                          path.as_posix(),
                          size,
                      )
                  )

          for path, size in warnings:
              print(
                  "WARNING: "
                  f"{path}: "
                  f"{size / 1024 / 1024:.2f} MiB"
              )

          if failures:
              for path, size in failures:
                  print(
                      "ERROR: "
                      f"{path}: "
                      f"{size / 1024 / 1024:.2f} MiB"
                  )

              raise SystemExit(
                  "One or more archive files "
                  "exceed the safe Git size limit."
              )

          print(
              "All archive files remain below "
              "the configured failure limit."
          )
          PY

      - name: Write workflow summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LOADED_CREDENTIAL_COUNT: ${{ steps.provider_credentials.outputs.loaded_count }}
          MISSING_CREDENTIAL_COUNT: ${{ steps.provider_credentials.outputs.missing_count }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_ORIGIN: ${{ steps.request.outputs.request_origin }}
          PROVIDER_COUNT: ${{ steps.provider_registry.outputs.provider_count }}
          ELIGIBLE_PROVIDER_COUNT: ${{ steps.provider_availability.outputs.eligible_count }}
          SKIPPED_PROVIDER_COUNT: ${{ steps.provider_availability.outputs.skipped_count }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          stats_path = Path(
              "static/data/statistics.json"
          )
          scheduler_path = Path(
              "static/data/taxonomy/scheduler.json"
          )

          stats = {}
          scheduler = {}

          if stats_path.exists():
              try:
                  stats = json.loads(
                      stats_path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  stats = {}

          if scheduler_path.exists():
              try:
                  scheduler = json.loads(
                      scheduler_path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  scheduler = {}

          print("# Speciedex Taxonomic Archive")
          print()
          print(f"Request: `{os.environ.get('REQUEST_ID', 'unknown')}`")
          print(f"Origin: `{os.environ.get('REQUEST_ORIGIN', 'unknown')}`")
          print("Scope: `all_providers`")
          eligible = int(os.environ.get("ELIGIBLE_PROVIDER_COUNT") or 0)
          skipped = int(os.environ.get("SKIPPED_PROVIDER_COUNT") or 0)
          execution = (
              "one registry-wide pass requested; "
              f"executable={eligible}; blocked={skipped}; "
              "provider selection disabled"
          )
          print(f"Execution: {execution}")
          print(
              "Orchestrated: `"
              + os.environ.get("ORCHESTRATED", "false").lower()
              + "`"
          )
          print()
          print("| Metric | Value |")
          print("|---|---:|")

          metrics = (
              (
                  "Validated providers",
                  os.environ.get("PROVIDER_COUNT", "0"),
              ),
              ("Species", stats.get("species", 0)),
              ("Subspecies", stats.get("subspecies", 0)),
              ("Genera", stats.get("genera", 0)),
              ("Families", stats.get("families", 0)),
              ("Orders", stats.get("orders", 0)),
              ("Classes", stats.get("classes", 0)),
              ("Phyla", stats.get("phyla", 0)),
              ("Kingdoms", stats.get("kingdoms", 0)),
              (
                  "Records archived",
                  stats.get("records_archived", 0),
              ),
              (
                  "Source assertions",
                  stats.get("source_assertions", 0),
              ),
              (
                  "Scheduler cursor",
                  scheduler.get("cursor", 0),
              ),
              (
                  "Executable providers",
                  os.environ.get("ELIGIBLE_PROVIDER_COUNT", "0"),
              ),
              (
                  "Blocked providers",
                  os.environ.get("SKIPPED_PROVIDER_COUNT", "0"),
              ),
              (
                  "Optional credentials loaded",
                  os.environ.get(
                      "LOADED_CREDENTIAL_COUNT",
                      "0",
                  ),
              ),
              (
                  "Optional credentials unavailable",
                  os.environ.get(
                      "MISSING_CREDENTIAL_COUNT",
                      "0",
                  ),
              ),
          )

          for label, value in metrics:
              print(
                  f"| {label} | {value} |"
              )

          print()
          print(
              "Workflow status: "
              + os.environ.get(
                  "JOB_STATUS",
                  "unknown",
              )
          )
          PY

      - name: Check for archive changes
        id: archive_changes
        run: |
          set -Eeuo pipefail

          if test -z "$(
            git status \
              --porcelain \
              --untracked-files=all \
              -- \
              static/data
          )"
          then
            printf '%s\n' \
              "changed=false" \
              >> "$GITHUB_OUTPUT"

            printf '%s\n' \
              "No taxonomic archive changes detected."
          else
            printf '%s\n' \
              "changed=true" \
              >> "$GITHUB_OUTPUT"

            printf '%s\n' \
              "Taxonomic archive changes detected."
          fi

      - name: Commit archive updates
        if: steps.archive_changes.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ env.TARGET_REF }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          REQUEST_ORIGIN: ${{ steps.request.outputs.request_origin }}
        run: |
          git config \
            user.name \
            "speciedex-taxonomy-bot"

          git config \
            user.email \
            "speciedex-taxonomy-bot@users.noreply.github.com"

          git add \
            static/data

          git commit \
            -m "Update Speciedex taxonomic archive" \
            -m "Scope: all 77 providers in one singular pass" \
            -m "Request: ${REQUEST_ID}" \
            -m "Origin: ${REQUEST_ORIGIN}" \
            -m "Orchestrated: ${ORCHESTRATED}" \
            -m "Workflow run: ${GITHUB_RUN_ID}"

          for attempt in 1 2 3
          do
            printf \
              'Synchronizing with %s, attempt %s.\n' \
              "$TARGET_BRANCH" \
              "$attempt"

            if git pull \
              --rebase \
              origin \
              "$TARGET_BRANCH" &&
               git push \
              origin \
              "HEAD:$TARGET_BRANCH"
            then
              printf '%s\n' \
                "Taxonomic archive update pushed successfully."

              exit 0
            fi

            git rebase \
              --abort \
              2>/dev/null ||
              true

            sleep "$((attempt * 5))"
          done

          printf '%s\n' \
            "Unable to push the taxonomic archive update."

          exit 1
