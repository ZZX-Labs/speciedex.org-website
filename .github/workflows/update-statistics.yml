name: Update Speciedex Public Taxonomic Archive

run-name: >-
  Taxonomic archive · all registered providers ·
  ${{ inputs.request_origin || github.event_name }} ·
  ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional request identifier for audit and terminal status records
        required: false
        default: ""
        type: string
      request_origin:
        description: Origin of the complete provider scan
        required: false
        default: manual
        type: choice
        options:
          - manual
          - scheduled
          - database
          - terminal
          - maintenance
      target_ref:
        description: Branch receiving generated archive products
        required: false
        default: main
        type: string

  workflow_call:
    inputs:
      request_id:
        description: Request identifier propagated by the calling workflow
        required: false
        default: ""
        type: string
      request_origin:
        description: Origin propagated by the calling workflow
        required: false
        default: workflow
        type: string
      target_ref:
        description: Branch receiving generated archive products
        required: false
        default: main
        type: string
      orchestrated:
        description: Mark a scan invoked by a database orchestrator
        required: false
        default: false
        type: boolean
    outputs:
      request_id:
        description: Normalized request identifier
        value: ${{ jobs.update.outputs.request_id }}
      provider_count:
        description: Number of validated registry providers
        value: ${{ jobs.update.outputs.provider_count }}
      eligible_count:
        description: Number of providers executable during this pass
        value: ${{ jobs.update.outputs.eligible_count }}
      skipped_count:
        description: Number of providers blocked by runtime prerequisites
        value: ${{ jobs.update.outputs.skipped_count }}
      archive_changed:
        description: Whether static/data changed during the scan
        value: ${{ jobs.update.outputs.archive_changed }}

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: >-
    speciedex-taxonomy-update-${{
      inputs.target_ref ||
      github.event.repository.default_branch ||
      github.ref_name
    }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Validate, scan, verify, and publish taxonomic archive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      provider_count: ${{ steps.registry.outputs.provider_count }}
      eligible_count: ${{ steps.availability.outputs.eligible_count }}
      skipped_count: ${{ steps.availability.outputs.skipped_count }}
      archive_changed: ${{ steps.changes.outputs.changed || 'false' }}

    env:
      PYTHONUNBUFFERED: "1"
      TARGET_REF: ${{ inputs.target_ref || github.event.repository.default_branch }}
      REQUEST_ID_INPUT: ${{ inputs.request_id || '' }}
      REQUEST_ORIGIN_INPUT: ${{ inputs.request_origin || github.event_name }}
      ORCHESTRATED: ${{ inputs.orchestrated || false }}
      TAXONOMY_ROOT: static/data/taxonomy
      STATISTICS_ROOT: static/data

    steps:
      - name: Normalize and validate request metadata
        id: request
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          request_id = (
              os.environ.get("REQUEST_ID_INPUT", "").strip()
              or f"taxonomy-{os.environ['GITHUB_RUN_ID']}"
          )
          request_origin = (
              os.environ.get("REQUEST_ORIGIN_INPUT", "").strip()
              or "unknown"
          )
          target_ref = os.environ.get("TARGET_REF", "").strip()

          if len(request_id) > 96:
              raise SystemExit("request_id exceeds 96 characters.")

          if not re.fullmatch(r"[A-Za-z0-9._:@/-]+", request_id):
              raise SystemExit(
                  "request_id contains unsupported characters."
              )

          if not re.fullmatch(
              r"(?!/)(?!.*//)(?!.*\.\.)(?!.*@\{)"
              r"[A-Za-z0-9._/-]+(?<![/.])",
              target_ref,
          ):
              raise SystemExit(
                  f"Unsafe target_ref: {target_ref!r}."
              )

          if target_ref.startswith("-"):
              raise SystemExit("target_ref cannot begin with '-'.")
          if target_ref.endswith(".lock"):
              raise SystemExit("target_ref cannot end with '.lock'.")

          github_output = Path(os.environ["GITHUB_OUTPUT"])
          github_env = Path(os.environ["GITHUB_ENV"])

          with github_output.open("a", encoding="utf-8") as output:
              output.write(f"request_id={request_id}\n")
              output.write(f"request_origin={request_origin}\n")
              output.write(f"target_ref={target_ref}\n")

          with github_env.open("a", encoding="utf-8") as environment:
              environment.write(f"REQUEST_ID={request_id}\n")
              environment.write(f"REQUEST_ORIGIN={request_origin}\n")
              environment.write(f"TARGET_REF={target_ref}\n")
          PY

      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.target_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: true

      - name: Load optional provider credentials
        id: credentials
        env:
          SECRET_EOL_API_KEY: ${{ secrets.EOL_API_KEY }}
          SECRET_IUCN_API_TOKEN: ${{ secrets.IUCN_API_TOKEN }}
          SECRET_NATURESERVE_API_KEY: ${{ secrets.NATURESERVE_API_KEY }}
          SECRET_NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SECRET_BACDIVE_USERNAME: ${{ secrets.BACDIVE_USERNAME }}
          SECRET_BACDIVE_PASSWORD: ${{ secrets.BACDIVE_PASSWORD }}
          SECRET_BHL_API_KEY: ${{ secrets.BHL_API_KEY }}
          SECRET_GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
          SECRET_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SECRET_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -Eeuo pipefail

          loaded=()
          missing=()

          export_secret() {
            local source_name="$1"
            local target_name="$2"
            local value="${!source_name:-}"

            if test -n "$value"
            then
              {
                printf '%s<<SPECIEDEX_SECRET_EOF\n' "$target_name"
                printf '%s\n' "$value"
                printf '%s\n' "SPECIEDEX_SECRET_EOF"
              } >> "$GITHUB_ENV"

              loaded+=("$target_name")
            else
              missing+=("$target_name")
            fi
          }

          export_secret SECRET_EOL_API_KEY EOL_API_KEY
          export_secret SECRET_IUCN_API_TOKEN IUCN_API_TOKEN
          export_secret SECRET_NATURESERVE_API_KEY NATURESERVE_API_KEY
          export_secret SECRET_NCBI_API_KEY NCBI_API_KEY
          export_secret SECRET_BACDIVE_USERNAME BACDIVE_USERNAME
          export_secret SECRET_BACDIVE_PASSWORD BACDIVE_PASSWORD
          export_secret SECRET_BHL_API_KEY BHL_API_KEY
          export_secret SECRET_GEONAMES_USERNAME GEONAMES_USERNAME
          export_secret SECRET_YOUTUBE_API_KEY YOUTUBE_API_KEY
          export_secret SECRET_GOOGLE_API_KEY GOOGLE_API_KEY

          printf 'loaded_count=%s\n' \
            "${#loaded[@]}" \
            >> "$GITHUB_OUTPUT"

          printf 'missing_count=%s\n' \
            "${#missing[@]}" \
            >> "$GITHUB_OUTPUT"

          printf 'Loaded optional credentials: %s\n' \
            "${loaded[*]:-none}"

          printf 'Unavailable optional credentials: %s\n' \
            "${missing[*]:-none}"

      - name: Validate Python source
        run: |
          set -Eeuo pipefail

          python -m py_compile \
            static/tools/stat-grabber.py

          python -m compileall -q \
            static/tools/core \
            static/tools/providers

      - name: Validate provider registry and exact module coverage
        id: registry
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import importlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          repo_root = Path.cwd()
          tools_root = repo_root / "static" / "tools"
          providers_root = tools_root / "providers"
          registry_path = tools_root / "providers.json"

          sys.path.insert(0, str(tools_root))

          registry = json.loads(
              registry_path.read_text(encoding="utf-8")
          )

          if not isinstance(registry, dict):
              raise SystemExit(
                  "providers.json root must be an object."
              )

          definitions = registry.get("providers")

          if not isinstance(definitions, list):
              raise SystemExit(
                  "providers.json does not contain a providers list."
              )

          valid_name = re.compile(r"^[a-z0-9][a-z0-9_-]*$")

          names: list[str] = []
          errors: list[str] = []

          for index, definition in enumerate(definitions):
              if not isinstance(definition, dict):
                  errors.append(
                      f"providers[{index}] is not an object."
                  )
                  continue

              name = str(definition.get("name", "")).strip()

              if not valid_name.fullmatch(name):
                  errors.append(
                      f"providers[{index}] has invalid name {name!r}."
                  )
                  continue

              if name in names:
                  errors.append(
                      f"Duplicate provider name: {name}."
                  )
                  continue

              names.append(name)

              if definition.get("enabled", True) is not True:
                  errors.append(
                      f"Provider is disabled: {name}."
                  )

              module_path = providers_root / f"{name}.py"

              if not module_path.is_file():
                  errors.append(
                      f"Missing provider module: {module_path.as_posix()}."
                  )
                  continue

              module_name = str(
                  definition.get(
                      "module",
                      f"providers.{name}",
                  )
              ).strip()

              try:
                  module = importlib.import_module(module_name)
              except Exception as error:
                  errors.append(
                      f"Import failed for {module_name}: "
                      f"{type(error).__name__}: {error}"
                  )
                  continue

              provider_class = getattr(module, "Provider", None)

              if provider_class is None:
                  errors.append(
                      f"{module_name} has no Provider class."
                  )
                  continue

              provider_name = str(
                  getattr(
                      provider_class,
                      "PROVIDER_NAME",
                      "",
                  )
              ).strip()

              if provider_name != name:
                  errors.append(
                      f"{module_name}.Provider.PROVIDER_NAME="
                      f"{provider_name!r}; expected {name!r}."
                  )

              if not callable(getattr(provider_class, "fetch", None)):
                  errors.append(
                      f"{module_name}.Provider has no callable fetch()."
                  )

          expected_count = 77

          if len(names) != expected_count:
              errors.append(
                  f"Provider count mismatch: expected {expected_count}, "
                  f"found {len(names)}."
              )

          if errors:
              raise SystemExit("\n".join(errors))

          print(
              f"Validated {len(names)} enabled provider modules."
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"provider_count={len(names)}\n")
          PY

      - name: Compute archive cache fingerprint
        id: archive_fingerprint
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          taxonomy_root = Path("static/data/taxonomy")
          manifest_path = taxonomy_root / "manifest.json"
          digest = hashlib.sha256()

          if manifest_path.is_file():
              manifest = json.loads(
                  manifest_path.read_text(encoding="utf-8")
              )

              digest.update(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              )
          else:
              digest.update(b"no-manifest")

          volumes_root = taxonomy_root / "volumes"

          if volumes_root.is_dir():
              for path in sorted(volumes_root.glob("*.jsonl")):
                  stat = path.stat()
                  digest.update(path.name.encode("utf-8"))
                  digest.update(str(stat.st_size).encode("ascii"))

          fingerprint = digest.hexdigest()

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"fingerprint={fingerprint}\n")

          print(f"Archive fingerprint: {fingerprint}")
          PY

      - name: Restore derived SQLite index cache
        id: sqlite_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            static/data/taxonomy/index.sqlite3
            static/data/taxonomy/index.sqlite3-wal
            static/data/taxonomy/index.sqlite3-shm
          key: >-
            speciedex-sqlite-${{ runner.os }}-${{
              steps.request.outputs.target_ref
            }}-${{ steps.archive_fingerprint.outputs.fingerprint }}
          restore-keys: |
            speciedex-sqlite-${{ runner.os }}-${{ steps.request.outputs.target_ref }}-

      - name: Validate restored SQLite index
        id: sqlite_validation
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sqlite3
          from pathlib import Path

          taxonomy_root = Path("static/data/taxonomy")
          database_path = taxonomy_root / "index.sqlite3"
          manifest_path = taxonomy_root / "manifest.json"

          archive_records = 0

          if manifest_path.is_file():
              manifest = json.loads(
                  manifest_path.read_text(encoding="utf-8")
              )
              archive_records = int(
                  manifest.get("total_primary_records", 0)
              )

          state = "missing"

          if database_path.is_file():
              database = sqlite3.connect(database_path)

              try:
                  integrity = database.execute(
                      "PRAGMA integrity_check"
                  ).fetchone()[0]

                  if integrity != "ok":
                      state = "corrupt"
                  else:
                      tables = {
                          row[0]
                          for row in database.execute(
                              "SELECT name FROM sqlite_master "
                              "WHERE type='table'"
                          )
                      }

                      required_tables = {
                          "taxa",
                          "source_ids",
                          "assertions",
                          "synonyms",
                          "conflicts",
                      }

                      if not required_tables.issubset(tables):
                          state = "incomplete"
                      else:
                          database_records = int(
                              database.execute(
                                  "SELECT COUNT(*) FROM taxa"
                              ).fetchone()[0]
                          )

                          if database_records != archive_records:
                              state = "stale"
                          else:
                              state = "valid"
              finally:
                  database.close()

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"state={state}\n")
              output.write(
                  f"archive_records={archive_records}\n"
              )

          print(
              f"SQLite cache state: {state}; "
              f"archive records: {archive_records}."
          )
          PY

      - name: Require a valid historical SQLite index
        if: steps.sqlite_validation.outputs.state != 'valid'
        run: |
          set -Eeuo pipefail

          archive_records="${{
            steps.sqlite_validation.outputs.archive_records
          }}"

          if test "$archive_records" = "0"
          then
            printf '%s\n' \
              "Archive is empty; a new SQLite index may be initialized."
          else
            printf '%s\n' \
              "ERROR: The append-only archive contains historical records, but" \
              "the restored SQLite index is missing, corrupt, incomplete, or stale." \
              "" \
              "The current archive format does not retain every unchanged" \
              "provider assertion and synonym needed to reconstruct the full" \
              "SQLite index without information loss." \
              "" \
              "Restore a valid index cache or run the repository's dedicated" \
              "lossless archive-to-SQLite reconstruction tool before this scan."

            exit 1
          fi

      - name: Initialize empty SQLite index
        if: >-
          steps.sqlite_validation.outputs.state != 'valid' &&
          steps.sqlite_validation.outputs.archive_records == '0'
        run: |
          set -Eeuo pipefail

          python static/tools/stat-grabber.py \
            reindex \
            --history-limit 1008

      - name: Inspect provider runtime availability
        id: availability
        run: |
          set -Eeuo pipefail

          availability="$RUNNER_TEMP/speciedex-provider-availability.json"

          python static/tools/stat-grabber.py \
            providers \
            > "$availability"

          cat "$availability"

          PROVIDER_AVAILABILITY="$availability" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PROVIDER_AVAILABILITY"])
          payload = json.loads(path.read_text(encoding="utf-8"))

          eligible = payload.get("eligible")
          skipped = payload.get("skipped")

          if not isinstance(eligible, list):
              raise SystemExit(
                  "Provider availability output has no eligible list."
              )

          if not isinstance(skipped, list):
              raise SystemExit(
                  "Provider availability output has no skipped list."
              )

          expected = int(
              os.environ.get("EXPECTED_PROVIDER_COUNT", "77")
          )
          accounted = len(eligible) + len(skipped)

          if accounted != expected:
              raise SystemExit(
                  "Provider accounting contract not met: "
                  f"expected={expected}; accounted={accounted}; "
                  f"eligible={len(eligible)}; skipped={len(skipped)}."
              )

          if not eligible:
              raise SystemExit(
                  "No providers are currently executable."
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"eligible_count={len(eligible)}\n")
              output.write(f"skipped_count={len(skipped)}\n")

          def markdown_cell(value: object) -> str:
              return (
                  str(value)
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
              )

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("## Provider execution availability\n\n")
              summary.write(
                  f"- Registered and validated: {expected}\n"
              )
              summary.write(
                  f"- Executable now: {len(eligible)}\n"
              )
              summary.write(
                  f"- Blocked or unavailable: {len(skipped)}\n\n"
              )

              if skipped:
                  summary.write("| Provider | Reason |\n")
                  summary.write("|---|---|\n")

                  for item in skipped:
                      if not isinstance(item, dict):
                          continue

                      provider = markdown_cell(
                          item.get("provider") or "unknown"
                      )
                      reason = markdown_cell(
                          item.get("reason") or "unspecified"
                      )
                      summary.write(
                          f"| `{provider}` | {reason} |\n"
                      )

          print(
              "Provider accounting satisfied: "
              f"registered={expected}; eligible={len(eligible)}; "
              f"skipped={len(skipped)}."
          )
          PY
        env:
          EXPECTED_PROVIDER_COUNT: ${{ steps.registry.outputs.provider_count }}

      - name: Verify archive before ingestion
        run: |
          set -Eeuo pipefail

          python static/tools/stat-grabber.py verify

      - name: Run one registry-wide provider pass
        run: |
          set -Eeuo pipefail

          python static/tools/stat-grabber.py \
            scan \
            --all-providers \
            --batch-size 5000 \
            --timeout 40 \
            --retries 5 \
            --backoff 2 \
            --volume-target-mb 48 \
            --volume-max-mb 90 \
            --history-limit 1008 \
            --verbose

      - name: Rebuild statistics from complete indexed archive
        run: |
          set -Eeuo pipefail

          python static/tools/stat-grabber.py \
            reindex \
            --history-limit 1008

      - name: Verify archive after ingestion
        run: |
          set -Eeuo pipefail

          python static/tools/stat-grabber.py verify

      - name: Validate generated JSON files
        run: |
          set -Eeuo pipefail

          required_json=(
            static/data/statistics.json
            static/data/statistics-sources.json
            static/data/statistics-history.json
            static/data/taxonomy/manifest.json
          )

          for file in "${required_json[@]}"
          do
            if ! test -f "$file"
            then
              printf 'Missing required JSON file: %s\n' "$file"
              exit 1
            fi

            python -m json.tool "$file" >/dev/null
          done

          if test -f static/data/taxonomy/scheduler.json
          then
            python -m json.tool \
              static/data/taxonomy/scheduler.json \
              >/dev/null
          fi

          if test -d static/data/taxonomy/provider-state
          then
            while IFS= read -r -d '' file
            do
              python -m json.tool "$file" >/dev/null
            done < <(
              find \
                static/data/taxonomy/provider-state \
                -type f \
                -name "*.json" \
                -print0
            )
          fi

      - name: Validate statistics against SQLite
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import sqlite3
          from pathlib import Path

          stats_path = Path("static/data/statistics.json")
          database_path = Path(
              "static/data/taxonomy/index.sqlite3"
          )

          stats = json.loads(
              stats_path.read_text(encoding="utf-8")
          )

          required_integer_keys = (
              "species",
              "subspecies",
              "genera",
              "families",
              "orders",
              "classes",
              "phyla",
              "kingdoms",
              "records_archived",
              "source_assertions",
              "synonyms",
              "unresolved_conflicts",
              "volumes",
          )

          for key in required_integer_keys:
              value = stats.get(key)

              if not isinstance(value, int) or value < 0:
                  raise SystemExit(
                      f"Invalid statistic {key}: {value!r}."
                  )

          aliases = {
              "genus": "genera",
              "family": "families",
              "order": "orders",
              "class": "classes",
              "phylum": "phyla",
              "kingdom": "kingdoms",
          }

          for singular, plural in aliases.items():
              if stats.get(singular) != stats.get(plural):
                  raise SystemExit(
                      f"Statistics alias mismatch: "
                      f"{singular}/{plural}."
                  )

          rank_counts = stats.get("rank_counts")

          if not isinstance(rank_counts, dict):
              raise SystemExit(
                  "rank_counts must be an object."
              )

          database = sqlite3.connect(database_path)
          database.row_factory = sqlite3.Row

          try:
              integrity = database.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

              if integrity != "ok":
                  raise SystemExit(
                      f"SQLite integrity check failed: {integrity}."
                  )

              expected = {
                  "records_archived": "SELECT COUNT(*) AS count FROM taxa",
                  "source_assertions": (
                      "SELECT COUNT(*) AS count FROM assertions"
                  ),
                  "synonyms": "SELECT COUNT(*) AS count FROM synonyms",
                  "unresolved_conflicts": (
                      "SELECT COUNT(*) AS count FROM conflicts"
                  ),
              }

              for key, query in expected.items():
                  actual = int(
                      database.execute(query).fetchone()["count"]
                  )

                  if stats[key] != actual:
                      raise SystemExit(
                          f"{key} mismatch: "
                          f"statistics={stats[key]}; sqlite={actual}."
                      )
          finally:
              database.close()

          print(
              json.dumps(
                  stats,
                  indent=2,
                  sort_keys=True,
              )
          )
          PY

      - name: Check generated file sizes
        run: |
          set -Eeuo pipefail

          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          warning_limit = 90 * 1024 * 1024
          failure_limit = 95 * 1024 * 1024

          warnings: list[tuple[str, int]] = []
          failures: list[tuple[str, int]] = []

          for path in Path("static/data").rglob("*"):
              if not path.is_file():
                  continue

              if (
                  path.suffix.lower() in {
                      ".sqlite",
                      ".sqlite3",
                      ".db",
                  }
                  or path.name.endswith(
                      (
                          "-wal",
                          "-shm",
                          "-journal",
                      )
                  )
              ):
                  continue

              size = path.stat().st_size

              if size >= failure_limit:
                  failures.append((path.as_posix(), size))
              elif size >= warning_limit:
                  warnings.append((path.as_posix(), size))

          for path, size in warnings:
              print(
                  f"WARNING: {path}: "
                  f"{size / 1024 / 1024:.2f} MiB"
              )

          if failures:
              for path, size in failures:
                  print(
                      f"ERROR: {path}: "
                      f"{size / 1024 / 1024:.2f} MiB"
                  )

              raise SystemExit(
                  "One or more archive files exceed "
                  "the configured Git size limit."
              )

          print(
              "All generated archive files remain below "
              "the configured failure limit."
          )
          PY

      - name: Save derived SQLite index cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            static/data/taxonomy/index.sqlite3
            static/data/taxonomy/index.sqlite3-wal
            static/data/taxonomy/index.sqlite3-shm
          key: >-
            speciedex-sqlite-${{ runner.os }}-${{
              steps.request.outputs.target_ref
            }}-${{ github.run_id }}

      - name: Remove derived SQLite products before commit
        run: |
          set -Eeuo pipefail

          rm -f \
            static/data/taxonomy/index.sqlite3 \
            static/data/taxonomy/index.sqlite3-wal \
            static/data/taxonomy/index.sqlite3-shm \
            static/data/taxonomy/index.sqlite3-journal

          if test -d static/data/taxonomy
          then
            find static/data/taxonomy \
              -type f \
              \( \
                -name "*.sqlite3-wal" \
                -o -name "*.sqlite3-shm" \
                -o -name "*.sqlite3-journal" \
                -o -name "*.sqlite-wal" \
                -o -name "*.sqlite-shm" \
                -o -name "*.sqlite-journal" \
              \) \
              -delete
          fi

      - name: Verify workflow did not modify web application sources
        run: |
          set -Eeuo pipefail

          protected_changes="$(
            git status \
              --porcelain \
              --untracked-files=all \
              -- \
              '*.html' \
              '*.css' \
              '*.js' \
              ':!static/data/**'
          )"

          if test -n "$protected_changes"
          then
            printf '%s\n' \
              "ERROR: This taxonomy workflow modified protected HTML, CSS, or JavaScript files:" \
              "$protected_changes"
            exit 1
          fi

          printf '%s\n' \
            "No HTML, CSS, or JavaScript source files were modified."

      - name: Check for archive changes
        id: changes
        run: |
          set -Eeuo pipefail

          if test -z "$(
            git status \
              --porcelain \
              --untracked-files=all \
              -- \
              static/data
          )"
          then
            printf '%s\n' \
              "changed=false" \
              >> "$GITHUB_OUTPUT"

            printf '%s\n' \
              "No taxonomic archive changes detected."
          else
            printf '%s\n' \
              "changed=true" \
              >> "$GITHUB_OUTPUT"

            printf '%s\n' \
              "Taxonomic archive changes detected."
          fi

      - name: Commit and push archive updates
        if: steps.changes.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_ref }}
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "speciedex-taxonomy-bot"

          git config \
            user.email \
            "speciedex-taxonomy-bot@users.noreply.github.com"

          git add -- static/data

          staged_outside_data="$(
            git diff \
              --cached \
              --name-only \
              -- \
              . \
              ':(exclude)static/data/**'
          )"

          if test -n "$staged_outside_data"
          then
            printf '%s\n' \
              "ERROR: Refusing to commit files outside static/data:" \
              "$staged_outside_data"
            exit 1
          fi

          git commit \
            -m "Update Speciedex taxonomic archive" \
            -m "Scope: one registry-wide provider pass" \
            -m "Request: ${REQUEST_ID}" \
            -m "Origin: ${REQUEST_ORIGIN}" \
            -m "Orchestrated: ${ORCHESTRATED}" \
            -m "Workflow run: ${GITHUB_RUN_ID}"

          for attempt in 1 2 3
          do
            printf \
              'Push attempt %s for branch %s.\n' \
              "$attempt" \
              "$TARGET_BRANCH"

            git fetch \
              --no-tags \
              origin \
              "$TARGET_BRANCH"

            if git rebase \
              "origin/$TARGET_BRANCH"
            then
              if git push \
                origin \
                "HEAD:refs/heads/$TARGET_BRANCH"
              then
                printf '%s\n' \
                  "Taxonomic archive update pushed successfully."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep "$((attempt * 5))"
          done

          printf '%s\n' \
            "Unable to push the taxonomic archive update."

          exit 1

      - name: Write workflow summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PROVIDER_COUNT: ${{ steps.registry.outputs.provider_count }}
          ELIGIBLE_PROVIDER_COUNT: ${{ steps.availability.outputs.eligible_count }}
          SKIPPED_PROVIDER_COUNT: ${{ steps.availability.outputs.skipped_count }}
          LOADED_CREDENTIAL_COUNT: ${{ steps.credentials.outputs.loaded_count }}
          MISSING_CREDENTIAL_COUNT: ${{ steps.credentials.outputs.missing_count }}
          ARCHIVE_CHANGED: ${{ steps.changes.outputs.changed || 'false' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          stats_path = Path("static/data/statistics.json")
          stats = {}

          if stats_path.is_file():
              try:
                  stats = json.loads(
                      stats_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  stats = {}

          print("# Speciedex Taxonomic Archive")
          print()
          print(f"Request: `{os.environ.get('REQUEST_ID', 'unknown')}`")
          print(f"Origin: `{os.environ.get('REQUEST_ORIGIN', 'unknown')}`")
          print(f"Target: `{os.environ.get('TARGET_REF', 'unknown')}`")
          print(
              "Orchestrated: `"
              + os.environ.get("ORCHESTRATED", "false").lower()
              + "`"
          )
          print(
              "Archive changed: `"
              + os.environ.get("ARCHIVE_CHANGED", "false").lower()
              + "`"
          )
          print()
          print("| Metric | Value |")
          print("|---|---:|")

          metrics = (
              (
                  "Validated providers",
                  os.environ.get("PROVIDER_COUNT", "0"),
              ),
              (
                  "Executable providers",
                  os.environ.get(
                      "ELIGIBLE_PROVIDER_COUNT",
                      "0",
                  ),
              ),
              (
                  "Blocked providers",
                  os.environ.get(
                      "SKIPPED_PROVIDER_COUNT",
                      "0",
                  ),
              ),
              ("Species", stats.get("species", 0)),
              ("Subspecies", stats.get("subspecies", 0)),
              ("Genera", stats.get("genera", 0)),
              ("Families", stats.get("families", 0)),
              ("Orders", stats.get("orders", 0)),
              ("Classes", stats.get("classes", 0)),
              ("Phyla", stats.get("phyla", 0)),
              ("Kingdoms", stats.get("kingdoms", 0)),
              (
                  "Records archived",
                  stats.get("records_archived", 0),
              ),
              (
                  "Source assertions",
                  stats.get("source_assertions", 0),
              ),
              (
                  "Optional credentials loaded",
                  os.environ.get(
                      "LOADED_CREDENTIAL_COUNT",
                      "0",
                  ),
              ),
              (
                  "Optional credentials unavailable",
                  os.environ.get(
                      "MISSING_CREDENTIAL_COUNT",
                      "0",
                  ),
              ),
          )

          for label, value in metrics:
              print(f"| {label} | {value} |")

          print()
          print(
              "Workflow status: "
              + os.environ.get("JOB_STATUS", "unknown")
          )
          PY
